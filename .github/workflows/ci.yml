name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      # No secrets are needed: every external call (LLM, search, embeddings,
      # vector store) is mocked, so the suite is deterministic and offline.
      - run: python -m pytest tests/ -q
        working-directory: backend

  frontend:
    name: Frontend typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npx eslint src --max-warnings=0
        working-directory: web
      - run: npm run build
        working-directory: web
